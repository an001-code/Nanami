[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanami"
version = "0.1.0"
description = "智能桌宠 Agent —— 常驻 Windows 桌面的 AI 数字伙伴"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<6.11",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "edge-tts>=6.1",
    "PyYAML>=6.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "chromadb>=0.5",
    "openai>=1.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
agent = [
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "faster-whisper>=1.0",
    "APScheduler>=3.10",
]

[project.scripts]
nanami = "nanami.app:main"

[tool.setuptools.packages.find]
where = ["src"]
