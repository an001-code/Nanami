<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪表盘</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2129;
    --panel2: #242a35;
    --border: #2e3440;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #ff8fa3;
    --ok: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  aside {
    width: 180px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .brand { padding: 18px 16px; font-weight: 600; font-size: 16px; color: var(--accent); }
  nav { display: flex; flex-direction: column; padding: 0 8px; }
  nav button {
    text-align: left;
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  nav button:hover { background: var(--panel2); color: var(--text); }
  nav button.active { background: var(--panel2); color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h2 { margin: 0; font-size: 18px; font-weight: 600; }
  #content { flex: 1; overflow-y: auto; padding: 20px; }
  footer {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 12px 20px; border-top: 1px solid var(--border); background: var(--panel);
  }
  button.primary {
    background: var(--accent); color: #1a1a1a; border: none; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  button.small {
    background: var(--panel2); color: var(--accent); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; cursor: default;
  }
  .card.selected { border-color: var(--accent); }
  .card-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 600; }
  .card-state { margin-top: 6px; }
  .section { margin-bottom: 22px; }
  .section h3 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.6;
  }
  .panel.sem { margin-bottom: 10px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .badge.ok { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.bad { background: rgba(248,113,113,.15); color: var(--bad); }
  .health-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); max-width: 360px; }
  .banner {
    background: rgba(248,113,113,.12); color: var(--bad); border: 1px solid var(--bad);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
  }
  .empty { color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; }
  .thread-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button.thread {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  button.thread.active { border-color: var(--accent); color: var(--accent); }
  .msg { margin-bottom: 10px; }
  .msg-meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg-body {
    display: inline-block; max-width: 80%; padding: 9px 13px; border-radius: 10px;
    background: var(--panel2); white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .msg.user .msg-body { background: rgba(255,143,163,.14); }
  .card.provider { margin-bottom: 10px; }
  .card.provider .muted { margin: 3px 0; }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; max-width: 320px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px;
  }
  select {
    width: 100%; max-width: 320px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px;
  }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; line-height: 1.5; }
</style>
</head>
<body>
<aside>
  <div class="brand" id="brand"></div>
  <nav id="nav"></nav>
</aside>
<main>
  <header>
    <h2 id="title">总览</h2>
    <button class="ghost" id="refresh">刷新</button>
  </header>
  <div id="content"></div>
  <footer>
    <span id="saveHint" class="muted"></span>
    <button class="primary" id="save" disabled>保存（重启后生效）</button>
  </footer>
</main>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
(function () {
  var nav = document.getElementById('nav');
  var title = document.getElementById('title');
  var content = document.getElementById('content');
  var refreshBtn = document.getElementById('refresh');
  var saveBtn = document.getElementById('save');
  var saveHint = document.getElementById('saveHint');

  var bridge = null;
  var current = 'overview';
  var dirty = false;
  var pending = { llm: { provider: null, model: null }, live2d: { model: null } };
  var importStatus = '';
  var voiceCfg = null;

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function badge(ok) {
    return ok ? '<span class="badge ok">正常</span>' : '<span class="badge bad">不可用</span>';
  }
  function banner(msg) { return '<div class="banner">连接失败：' + esc(msg) + '</div>'; }
  function empty(msg) { return '<p class="empty">' + esc(msg) + '</p>'; }
  function setDirty(v) { dirty = v; saveBtn.disabled = !v; }

  function card(label, value, ok) {
    return '<div class="card"><div class="card-label">' + esc(label) + '</div>' +
      '<div class="card-value">' + value + '</div>' +
      '<div class="card-state">' + badge(ok) + '</div></div>';
  }
  function healthRow(name, ok) {
    return '<div class="health-row"><span>' + esc(name) + '</span>' + badge(ok) + '</div>';
  }
  function listSection(titleText, items) {
    var list = (items || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
    return '<div class="section"><h3>' + esc(titleText) + '</h3>' +
      (list ? '<ul>' + list + '</ul>' : '<p class="muted">（无）</p>') + '</div>';
  }

  // ---- 各标签渲染 ----
  function renderOverview() {
    bridge.getOverview(function (raw) {
      var o = JSON.parse(raw);
      if (o.error) { content.innerHTML = banner(o.error); return; }
      var h = o.health || {}, c = o.counts || {}, cfg = o.config || {};
      content.innerHTML =
        '<div class="cards">' +
        card('对话历史', c.history != null ? c.history : 0, h.postgres) +
        card('线程数', c.threads != null ? c.threads : 0, h.postgres) +
        card('语义记忆', c.semantic != null ? c.semantic : 0, h.chroma) +
        card('工作记忆轮次', c.work_recent != null ? c.work_recent : 0, h.redis) +
        card('画像 facts', c.profile_facts != null ? c.profile_facts : 0, h.redis) +
        '</div>' +
        '<div class="section"><h3>后端健康</h3>' +
        healthRow('PostgreSQL', h.postgres) +
        healthRow('Redis', h.redis) +
        healthRow('Chroma', h.chroma) +
        '</div>' +
        '<div class="section"><h3>当前配置</h3><p>服务商：' + esc(cfg.provider) +
        ' · 模型：' + esc(cfg.model) + ' · Live2D：' + esc(cfg.live2d_model) + '</p></div>';
    });
  }

  function renderHistory() {
    bridge.getThreads(function (raw) {
      var r = JSON.parse(raw);
      if (!r.ok) { content.innerHTML = banner(r.error); return; }
      var threads = r.data || [];
      if (!threads.length) { content.innerHTML = empty('暂无对话线程'); return; }
      var html = '<div class="thread-list">';
      threads.forEach(function (t) {
        html += '<button class="thread" data-id="' + esc(t.thread_id) + '">' +
          esc(t.thread_id) + ' <span class="muted">(' + t.count + ')</span></button>';
      });
      html += '</div><div id="messages"></div>';
      content.innerHTML = html;
      var btns = content.querySelectorAll('.thread');
      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          btns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          loadHistory(btn.dataset.id);
        });
      });
      btns[0].classList.add('active');
      loadHistory(btns[0].dataset.id);
    });
  }
  function loadHistory(threadId) {
    bridge.getHistory(threadId, 100, function (raw) {
      var r = JSON.parse(raw);
      var box = document.getElementById('messages');
      if (!box) return;
      if (!r.ok) { box.innerHTML = banner(r.error); return; }
      var rows = r.data.rows || [];
      if (!rows.length) { box.innerHTML = empty('暂无消息'); return; }
      box.innerHTML = rows.slice().reverse().map(function (m) {
        return '<div class="msg ' + esc(m.role) + '">' +
          '<div class="msg-meta">' + esc(m.role) + ' · ' + esc(m.created_at || '') + '</div>' +
          '<div class="msg-body">' + esc(m.content) + '</div></div>';
      }).join('');
      if (r.data.has_more) box.innerHTML += '<p class="muted">（仅显示最近 100 条）</p>';
    });
  }

  function renderWorkMemory() {
    bridge.getWorkMemory(function (raw) {
      var r = JSON.parse(raw);
      if (!r.ok) { content.innerHTML = banner(r.error); return; }
      var d = r.data || {};
      var recent = (d.recent || []).map(function (m) {
        return '<div class="msg ' + esc(m.role) + '">' +
          '<div class="msg-meta">' + esc(m.role) + '</div>' +
          '<div class="msg-body">' + esc(m.content) + '</div></div>';
      }).join('');
      content.innerHTML =
        '<div class="section"><h3>滚动摘要</h3><div class="panel">' +
        (d.summary ? esc(d.summary) : '<span class="muted">（暂无摘要）</span>') + '</div></div>' +
        '<div class="section"><h3>最近轮次</h3>' + (recent || empty('暂无')) + '</div>';
    });
  }

  function renderProfile() {
    bridge.getProfile(function (raw) {
      var r = JSON.parse(raw);
      if (!r.ok) { content.innerHTML = banner(r.error); return; }
      var p = r.data || {};
      if (!Object.keys(p).length) { content.innerHTML = empty('暂无画像'); return; }
      content.innerHTML =
        '<div class="section"><h3>名字</h3><p>' +
        (esc(p.name) || '<span class="muted">（未知）</span>') + '</p></div>' +
        listSection('偏好', p.preferences) +
        listSection('印象', p.impressions) +
        listSection('事实', p.facts) +
        '<p class="muted">更新时间：' + esc(p.updated_at || '') + '</p>';
    });
  }

  function renderSemantic() {
    bridge.listSemantic(100, function (raw) {
      var r = JSON.parse(raw);
      if (!r.ok) { content.innerHTML = banner(r.error); return; }
      var items = r.data || [];
      if (!items.length) { content.innerHTML = empty('暂无语义记忆'); return; }
      content.innerHTML = items.map(function (it) {
        var meta = it.metadata || {};
        return '<div class="panel sem"><div class="msg-body">' + esc(it.text) + '</div>' +
          '<div class="muted">thread: ' + esc(meta.thread_id || '') + ' · ' + esc(meta.ts || '') + '</div></div>';
      }).join('');
    });
  }

  function renderModels() {
    bridge.listModels(function (raw) {
      var r = JSON.parse(raw);
      if (r.error) { content.innerHTML = banner(r.error); return; }
      var models = r.models || [], active = r.active;
      content.innerHTML =
        '<div class="section">' +
        '<button class="primary" id="importModelBtn" style="margin-bottom:8px;">导入模型</button>' +
        '<p class="muted" id="importHint">' + esc(importStatus) + '</p></div>' +
        '<p class="muted">切换 = 立即重载；删除会先弹出确认框</p>' +
        (models.length ? models.map(function (m) {
          var isActive = m === active;
          return '<div class="card model" data-model="' + esc(m) + '">' +
            '<div class="card-label">' + esc(m) +
            (isActive ? ' <span class="badge ok">当前</span>' : '') + '</div>' +
            '<button class="small" data-act="switch"' + (isActive ? ' disabled' : '') + '>切换</button> ' +
            '<button class="small" data-act="del"' + (isActive ? ' disabled' : '') + '>删除</button></div>';
        }).join('') : '<p class="empty">未找到模型目录（live2d/static/l2d/*）</p>');
      document.getElementById('importModelBtn').addEventListener('click', function () {
        importStatus = '正在导入…';
        document.getElementById('importHint').textContent = importStatus;
        bridge.importModel(function (raw) {
          var res = JSON.parse(raw);
          if (res.cancelled) {
            importStatus = '';
            document.getElementById('importHint').textContent = '';
          } else if (!res.ok) {
            importStatus = '导入失败：' + (res.error || '');
            document.getElementById('importHint').textContent = importStatus;
          }
        });
      });
      content.querySelectorAll('.card.model button[data-act="switch"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var mid = btn.closest('.card').dataset.model;
          bridge.applyModel(mid, function (raw) {
            var res = JSON.parse(raw);
            importStatus = res.ok ? ('已切换为 ' + mid) : ('切换失败：' + (res.error || ''));
            document.getElementById('importHint').textContent = importStatus;
          });
        });
      });
      content.querySelectorAll('.card.model button[data-act="del"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var mid = btn.closest('.card').dataset.model;
          bridge.deleteModel(mid, function (raw) {
            var res = JSON.parse(raw);
            if (res.cancelled) { return; }
            if (res.ok) {
              importStatus = '已删除 ' + mid;
              renderModels();
            } else {
              importStatus = '删除失败：' + (res.error || '');
              document.getElementById('importHint').textContent = importStatus;
            }
          });
        });
      });
    });
  }

  function onImportResult(raw) {
    var res = JSON.parse(raw);
    importStatus = res.ok ? ('导入成功：' + (res.model || '')) : ('导入失败：' + (res.error || ''));
    if (current === 'models') { renderModels(); }
  }

  function renderProviders() {
    bridge.getConfig(function (raw) {
      var cfg = JSON.parse(raw);
      var llm = cfg.llm || {};
      var providers = llm.providers || [];
      var active = llm.provider;
      var sel = pending.llm.provider || active;
      content.innerHTML =
        '<div class="section"><h3>模型 ID</h3>' +
        '<input id="llmModel" type="text" value="' + esc(llm.model || '') + '"></div>' +
        '<div class="section"><h3>服务商</h3>' +
        providers.map(function (p) {
          return '<div class="card provider' + (p.name === sel ? ' selected' : '') + '" data-provider="' + esc(p.name) + '">' +
            '<div class="card-label">' + esc(p.name) +
            (p.name === active ? ' <span class="badge ok">当前</span>' : '') + '</div>' +
            '<div class="muted">' + esc(p.base_url) + '</div>' +
            '<div class="muted">环境变量：' + esc(p.api_key_env || '（无需 key）') + '</div>' +
            '<button class="small">切换</button></div>';
        }).join('') + '</div>';
      content.querySelectorAll('.card.provider').forEach(function (el) {
        el.addEventListener('click', function () {
          pending.llm.provider = el.dataset.provider;
          setDirty(true);
          renderProviders();
        });
      });
      var input = document.getElementById('llmModel');
      input.addEventListener('input', function () {
        pending.llm.model = input.value.trim();
        setDirty(true);
      });
    });
  }

  var EDGE_VOICES = [
    'zh-CN-XiaoxiaoNeural', 'zh-CN-XiaoyiNeural', 'zh-CN-YunxiNeural',
    'zh-CN-YunjianNeural', 'zh-CN-YunyangNeural', 'zh-CN-YunxiaNeural',
    'zh-CN-XiaochenNeural', 'zh-CN-XiaohanNeural', 'zh-CN-XiaomengNeural',
    'zh-CN-XiaomoNeural', 'zh-CN-XiaoqiuNeural', 'zh-CN-XiaoruiNeural',
    'zh-CN-XiaoshuangNeural', 'zh-CN-XiaoxuanNeural', 'zh-CN-XiaoyanNeural',
    'zh-CN-XiaoyouNeural', 'zh-CN-liaoning-XiaobeiNeural', 'zh-CN-shaanxi-XiaoniNeural'
  ];

  function renderVoice() {
    bridge.getVoiceConfig(function (raw) {
      voiceCfg = JSON.parse(raw) || {};
      drawVoice();
    });
  }

  function drawVoice() {
    var t = voiceCfg || {};
    var provider = t.provider || 'edge';
    var radios = ['edge', 'cosyvoice', 'http'].map(function (p) {
      return '<label style="display:inline-block;margin-right:16px;font-size:14px;">' +
        '<input type="radio" name="ttsProvider" value="' + p + '"' +
        (p === provider ? ' checked' : '') + '> ' + p + '</label>';
    }).join('');

    var fields = '';
    if (provider === 'edge') {
      var cur = t.voice || 'zh-CN-XiaoxiaoNeural';
      var list = EDGE_VOICES.slice();
      if (list.indexOf(cur) === -1) list.unshift(cur);
      var opts = list.map(function (v) {
        return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>';
      }).join('');
      fields =
        '<div class="section"><h3>音色</h3><select id="edgeVoice">' + opts + '</select></div>' +
        '<div class="section"><h3>语速 rate</h3><input id="edgeRate" type="text" value="' + esc(t.rate || '+0%') + '"></div>' +
        '<div class="section"><h3>音量 volume</h3><input id="edgeVolume" type="text" value="' + esc(t.volume || '+0%') + '"></div>' +
        '<div class="section"><h3>音调 pitch</h3><input id="edgePitch" type="text" value="' + esc(t.pitch || '+0Hz') + '"></div>';
    } else if (provider === 'cosyvoice') {
      var c = t.cosyvoice || {};
      fields =
        '<div class="section"><h3>模型 model</h3><input id="cvModel" type="text" value="' + esc(c.model || 'cosyvoice-v3.5-plus') + '"></div>' +
        '<div class="section"><h3>音色 ID（voice_id）</h3><input id="cvVoice" type="text" value="' + esc(c.voice || '') + '"></div>' +
        '<div class="section"><h3>格式</h3><select id="cvFormat">' +
        '<option' + ((c.format || 'mp3') === 'mp3' ? ' selected' : '') + '>mp3</option>' +
        '<option' + ((c.format || 'mp3') === 'wav' ? ' selected' : '') + '>wav</option>' +
        '</select></div>' +
        '<div class="section"><h3>采样率</h3><input id="cvSample" type="text" value="' + esc(c.sample_rate || 24000) + '"></div>';
    } else {
      var h = t.http || {};
      fields =
        '<div class="section"><h3>URL</h3><input id="httpUrl" type="text" value="' + esc(h.url || '') + '"></div>';
    }

    content.innerHTML =
      '<div class="section"><h3>Provider</h3>' + radios + '</div>' +
      fields +
      '<div class="section"><h3>试听</h3>' +
      '<input id="previewText" type="text" placeholder="输入要试听的文字" style="max-width:100%;">' +
      '<button class="primary" id="previewBtn" style="margin-top:8px;">试听</button>' +
      '<audio id="previewAudio" controls style="display:none;margin-top:8px;"></audio></div>' +
      '<div class="section"><button class="primary" id="saveVoice">保存（立即生效）</button> ' +
      '<span id="voiceHint" class="muted"></span></div>';

    content.querySelectorAll('input[name="ttsProvider"]').forEach(function (el) {
      el.addEventListener('change', function () {
        voiceCfg.provider = el.value;
        drawVoice();
      });
    });

    document.getElementById('saveVoice').addEventListener('click', function () {
      collectVoice();
      bridge.saveVoiceConfig(JSON.stringify(voiceCfg), function (raw) {
        var r = JSON.parse(raw);
        document.getElementById('voiceHint').textContent =
          r.ok ? '已保存，立即生效' : ('保存失败：' + (r.error || ''));
      });
    });

    document.getElementById('previewBtn').addEventListener('click', function () {
      collectVoice();
      var text = document.getElementById('previewText').value.trim();
      if (!text) { document.getElementById('voiceHint').textContent = '请输入试听文字'; return; }
      document.getElementById('voiceHint').textContent = '合成中…';
      bridge.previewVoice(text, JSON.stringify(voiceCfg), function (raw) {
        var r = JSON.parse(raw);
        if (!r.ok) { document.getElementById('voiceHint').textContent = '试听失败：' + (r.error || ''); return; }
        var audio = document.getElementById('previewAudio');
        audio.src = 'data:' + r.mime + ';base64,' + r.base64;
        audio.style.display = 'block';
        document.getElementById('voiceHint').textContent = '';
        audio.play();
      });
    });
  }

  function collectVoice() {
    var p = voiceCfg.provider;
    if (p === 'edge') {
      voiceCfg.voice = document.getElementById('edgeVoice').value;
      voiceCfg.rate = document.getElementById('edgeRate').value.trim();
      voiceCfg.volume = document.getElementById('edgeVolume').value.trim();
      voiceCfg.pitch = document.getElementById('edgePitch').value.trim();
    } else if (p === 'cosyvoice') {
      voiceCfg.cosyvoice = voiceCfg.cosyvoice || {};
      voiceCfg.cosyvoice.model = document.getElementById('cvModel').value.trim();
      voiceCfg.cosyvoice.voice = document.getElementById('cvVoice').value.trim();
      voiceCfg.cosyvoice.format = document.getElementById('cvFormat').value;
      voiceCfg.cosyvoice.sample_rate = parseInt(document.getElementById('cvSample').value, 10) || 24000;
    } else if (p === 'http') {
      voiceCfg.http = voiceCfg.http || {};
      voiceCfg.http.url = document.getElementById('httpUrl').value.trim();
    }
  }

  function applyNameToChrome(name) {
    document.title = name + ' · 仪表盘';
    var brand = document.getElementById('brand');
    if (brand) brand.textContent = name + ' · 仪表盘';
  }

  function renderSettings() {
    bridge.getPetName(function (raw) {
      var r = JSON.parse(raw);
      var name = (r && r.name) || '七海';
      content.innerHTML =
        '<div class="section"><h3>桌宠名称</h3>' +
        '<input id="petName" type="text" value="' + esc(name) + '">' +
        '<button class="primary" id="savePetName" style="margin-top:8px;">保存（立即生效）</button> ' +
        '<span id="petNameHint" class="muted"></span></div>';
      document.getElementById('savePetName').addEventListener('click', function () {
        var n = document.getElementById('petName').value.trim();
        if (!n) { document.getElementById('petNameHint').textContent = '名字不能为空'; return; }
        bridge.savePetName(n, function (raw) {
          var res = JSON.parse(raw);
          if (res.ok) {
            applyNameToChrome(n);
            document.getElementById('petNameHint').textContent = '已保存，立即生效';
          } else {
            document.getElementById('petNameHint').textContent = '保存失败：' + (res.error || '');
          }
        });
      });
    });
  }

  var tabs = [
    { id: 'overview', label: '总览', render: renderOverview },
    { id: 'history', label: '对话历史', render: renderHistory },
    { id: 'workmemory', label: '工作记忆', render: renderWorkMemory },
    { id: 'profile', label: '用户画像', render: renderProfile },
    { id: 'semantic', label: '语义记忆', render: renderSemantic },
    { id: 'models', label: '模型', render: renderModels },
    { id: 'providers', label: '模型供应商', render: renderProviders },
    { id: 'voice', label: '语音', render: renderVoice },
    { id: 'settings', label: '设置', render: renderSettings }
  ];

  function selectTab(id) {
    current = id;
    nav.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.id === id);
    });
    var t = tabs.find(function (x) { return x.id === id; });
    title.textContent = t.label;
    t.render();
  }

  function doSave() {
    var partial = {};
    if (pending.llm.provider) partial.llm = { provider: pending.llm.provider };
    if (pending.llm.model) partial.llm = Object.assign(partial.llm || {}, { model: pending.llm.model });
    if (pending.live2d.model) partial.live2d = { model: pending.live2d.model };
    if (!Object.keys(partial).length) return;
    bridge.saveConfig(JSON.stringify(partial), function (raw) {
      var r = JSON.parse(raw);
      if (r.ok) {
        saveHint.textContent = '已保存，重启后生效';
        pending = { llm: { provider: null, model: null }, live2d: { model: null } };
        setDirty(false);
      } else {
        saveHint.textContent = '保存失败：' + (r.error || '');
      }
    });
  }

  function init() {
    nav.innerHTML = tabs.map(function (t) {
      return '<button data-id="' + t.id + '">' + t.label + '</button>';
    }).join('');
    nav.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { selectTab(b.dataset.id); });
    });
    refreshBtn.addEventListener('click', function () { selectTab(current); });
    saveBtn.addEventListener('click', doSave);
    bridge.import_finished.connect(onImportResult);
    bridge.getPetName(function (raw) {
      var r = JSON.parse(raw);
      applyNameToChrome((r && r.name) || '七海');
    });
    selectTab('overview');
  }

  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    init();
  });
})();
</script>
</body>
</html>
