# 智能桌宠 Agent 配置
# API key 一律通过环境变量注入，不要写进本文件

llm:
  # 当前使用的 provider（见 providers 键）
  provider: deepseek
  # 对话使用的文本模型
  model: deepseek-chat
  # 屏幕感知使用的视觉模型（需多模态能力）
  vision_model: qwen-vl-max
  temperature: 0.7

  providers:
    deepseek:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    openai:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    ollama:
      base_url: http://localhost:11434/v1
      api_key_env: ""            # 本地模型无需 key

voice:
  tts:
    # Edge TTS 音色（中文）
    voice: zh-CN-XiaoxiaoNeural
    rate: "+0%"
    volume: "+0%"
  stt:
    # faster-whisper 模型大小
    model: base

permissions:
  # 默认裁决：ask / allow / deny
  default: ask
  allowlist: []
  denylist: []

memory:
  postgres:
    dsn: postgresql://nanami:nanami@127.0.0.1:5432/nanami
  redis:
    url: redis://127.0.0.1:6390/0
    key_prefix: "nanami:"
  vector:
    path: data/chroma
    collection: conversation_summaries
    top_k: 5
    max_distance: 0.5
  embedding:
    provider: qwen
    model: text-embedding-v3
    dimensions: 1024
    batch_size: 16
  work_memory:
    high_token_threshold: 4000
    low_token_threshold: 2000
    keep_recent_turns: 6
  profile:
    enabled: true
  worker:
    queue_size: 100
    shutdown_timeout_sec: 5

# 工作区：file_ops 工具的读写被限制在此目录内
workspace:
  root: workspace

# Live2D 模型：static 目录下的 l2d/<model> 目录名
live2d:
  model: LSS

# MCP 外部 server（Phase 2）
mcp:
  servers: []
