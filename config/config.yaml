pet:
  name: 七十
llm:
  provider: deepseek
  model: deepseek-chat
  vision_model: qwen-vl-max
  temperature: 0.7
  providers:
    deepseek:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
    openai:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    ollama:
      base_url: http://localhost:11434/v1
      api_key_env: ''
voice:
  tts:
    provider: cosyvoice
    voice: zh-CN-XiaoxiaoNeural
    rate: +0%
    volume: +0%
    pitch: +0Hz
    http:
      url: http://127.0.0.1:9880/
      out_format: wav
    cosyvoice:
      model: cosyvoice-v3.5-plus
      voice: cosyvoice-v3.5-plus-bailian-3670d26ff80b4176b5beb1e9f55286f0
      api_key_env: DASHSCOPE_API_KEY
      format: mp3
      sample_rate: 24000
  stt:
    model: base
permissions:
  default: ask
  allowlist: []
  denylist: []
memory:
  postgres:
    dsn: postgresql://nanami:nanami@127.0.0.1:5432/nanami
  redis:
    url: redis://127.0.0.1:6390/0
    key_prefix: 'nanami:'
  vector:
    path: data/chroma
    collection: conversation_summaries
    top_k: 5
    max_distance: 0.5
  embedding:
    provider: qwen
    model: text-embedding-v3
    dimensions: 1024
    batch_size: 16
  work_memory:
    high_token_threshold: 4000
    low_token_threshold: 2000
    keep_recent_turns: 6
  profile:
    enabled: true
  worker:
    queue_size: 100
    shutdown_timeout_sec: 5
workspace:
  root: workspace
live2d:
  model: hiyori_pro_t11
mcp:
  servers: []
